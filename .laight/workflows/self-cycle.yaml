# yaml-language-server: $schema=https://raw.githubusercontent.com/berni23/laight/main/schema/workflow.schema.json
#
# laight on itself (#50): the next item of baton.md, taken to a merged PR by two Claude Code
# sessions, with no human typing.
#   pickup → review → fix → verify ─(pass)→ merge
#                      ↑       └─(fail)─┘
# Start it with:  laight run self-cycle
version: 1
id: self-cycle
summary: The next baton.md item, implemented, cross-reviewed and merged into {{ .base }}.
base: main

seats:
  impl:
    label: Implementer
    session: resume               # the session that picked the item up also fixes the review
    permissions: auto             # prompts it can't decide go to `laight inbox`
  reviewer:
    label: Reviewer
    session: resume               # verify asks the same session that wrote the review
    permissions: auto

steps:
  - id: pickup
    seat: impl
    objective: |
      /baton:pickup
      Work the item on its own branch until its PR into {{ .base }} is open. When it is, finish with:
      laight done handoff pr=<PR URL>
    next_hop: { on: { handoff: review } }

  - id: review                    # the reviewer's session starts with this prompt
    seat: reviewer
    objective: |
      /cross:cr {{ .steps.pickup.out.pr }}
      When the review is posted on the PR, finish with: laight done handoff
    next_hop: { on: { handoff: fix } }

  - id: fix
    seat: impl
    compact: true                 # /compact first: the pickup leaves a long conversation behind
    objective: |
      /cross:fix-cr {{ .steps.pickup.out.pr }}
      When the fixes are pushed and the review answered on the PR, finish with: laight done handoff
    next_hop: { on: { handoff: verify } }

  - id: verify
    seat: reviewer
    objective: |
      The implementer has answered your review on {{ .steps.pickup.out.pr }}. Check every finding
      against the PR's new commits and replies: has each one been addressed?
      All addressed: laight done pass
      Anything not: laight done fail unresolved="<finding numbers>"
    allowed_exits: [pass, fail]
    next_hop: { on: { pass: merge, fail: fix } }

  - id: merge                     # the run ends once the PR is merged
    type: shell
    run: gh pr merge {{ .steps.pickup.out.pr }} --merge

loop_guards: { max_hops: 9 }      # 5 steps, plus up to 2 more fix → verify rounds
timeouts: { step: 90m }           # quiet this long → a `stuck` inbox item
on_finish: { success: destroy, failure: keep }
